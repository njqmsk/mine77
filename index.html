<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="format-detection" content="telephone=no,email=no,address=no" />
<title>扫雷 · NJ77</title>
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    overflow:hidden;
    overscroll-behavior:none;
    background:
      radial-gradient(1100px 620px at 50% -14%, #22304a 0%, rgba(15,23,42,0) 62%),
      linear-gradient(170deg,#0b1220 0%,#0f1728 55%,#0a0f1b 100%);
    color:#e6edf6;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center;
    padding:8px;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
    touch-action:manipulation;
  }

  .app{
    position:relative;
    width:100%;
    max-width:840px;
    height:min(96dvh, 820px);
    display:flex; flex-direction:column;
    padding:14px 14px calc(14px + env(safe-area-inset-bottom));
    border-radius:26px;
    background:rgba(15,23,42,.72);
    box-shadow:0 0 0 1px rgba(255,255,255,.08), 0 30px 80px -20px rgba(0,0,0,.9);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
  }

  /* ---------- 顶部 ---------- */
  .top{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; margin-bottom:10px;
  }
  .brand{ display:flex; align-items:center; gap:7px; }
  .brand .bomb{ font-size:19px; }
  .brand h1{
    margin:0; font-size:17px; font-weight:600;
    letter-spacing:.06em; color:#e8eef7;
  }

  /* 署名 */
  .sign{
    font-family:Georgia,"Times New Roman",serif;
    font-style:italic;
    font-weight:700;
    font-size:19px;
    letter-spacing:.05em;
    line-height:1;
    background:linear-gradient(160deg,#fff0bd 0%,#f5b942 58%,#d98317 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 2px 7px rgba(245,185,66,.34));
    padding-left:10px;
  }

  /* ---------- 难度 + 模式 ---------- */
  .bar{
    display:flex; align-items:center; justify-content:space-between;
    gap:8px; margin-bottom:10px; flex-wrap:wrap;
  }
  .diffs{ display:flex; gap:6px; }
  .diff-btn{
    padding:6px 13px; border:0; border-radius:999px;
    font-size:12.5px; font-weight:600; font-family:inherit;
    color:#9fb0c7; background:rgba(255,255,255,.055);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);
    transition:all .16s ease; cursor:pointer; white-space:nowrap;
  }
  .diff-btn.active{
    color:#20180a;
    background:linear-gradient(160deg,#ffe08a,#f5b942);
    box-shadow:0 4px 12px rgba(245,185,66,.32);
  }
  .mode{
    padding:6px 13px; border:0; border-radius:999px;
    font-size:12.5px; font-weight:600; font-family:inherit;
    color:#cbd8e8; background:rgba(255,255,255,.07);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);
    cursor:pointer; white-space:nowrap; transition:all .16s ease;
  }
  .mode.on{
    color:#1b1206;
    background:linear-gradient(160deg,#ffd166,#f0932b);
    box-shadow:0 4px 12px rgba(240,147,43,.34);
  }

  /* ---------- HUD ---------- */
  .hud{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; margin-bottom:10px; padding:0 2px;
  }
  .led{
    min-width:80px; padding:7px 10px; border-radius:10px;
    background:linear-gradient(180deg,#0b1424,#101c2f);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07), 0 1px 2px rgba(0,0,0,.4);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:20px; letter-spacing:.09em; text-align:center;
    color:#ffd166; font-variant-numeric:tabular-nums;
  }
  #face{
    width:50px; height:50px; border:0; border-radius:14px;
    font-size:27px; line-height:1; cursor:pointer;
    display:grid; place-items:center;
    background:linear-gradient(160deg,#f8fafc,#c3d0e0);
    box-shadow:0 3px 0 #7b8ba1, 0 8px 18px rgba(0,0,0,.4);
    transition:transform .07s ease, box-shadow .07s ease;
  }
  #face:active{ transform:translateY(3px); box-shadow:0 0 0 #7b8ba1, 0 4px 10px rgba(0,0,0,.4); }

  /* ---------- 棋盘 ---------- */
  .board-wrap{
    flex:1 1 auto; min-height:0; overflow:auto;
    display:flex; padding:12px;
    border-radius:16px;
    overscroll-behavior:contain;
    scrollbar-width:thin; scrollbar-color:#334155 transparent;
  }
  .board-wrap::-webkit-scrollbar{ width:7px; height:7px; }
  .board-wrap::-webkit-scrollbar-thumb{ background:#334155; border-radius:8px; }

  .board{
    --cell:32px; --gap:2px;
    display:grid;
    grid-template-columns:repeat(var(--cols,9), var(--cell));
    gap:var(--gap);
    margin:auto;
    padding:10px;
    border-radius:14px;
    background:linear-gradient(180deg,#c8d4e3,#aebdcf);
    box-shadow:0 18px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.7);
  }

  .cell{
    width:var(--cell); height:var(--cell);
    border-radius:calc(var(--cell) * .17);
    display:grid; place-items:center;
    font-size:calc(var(--cell) * .58);
    font-weight:700; line-height:1;
    font-variant-numeric:tabular-nums;
    cursor:pointer; user-select:none;
    -webkit-user-select:none; -webkit-touch-callout:none;
    touch-action:manipulation;
    background:linear-gradient(145deg,#fdfefe,#c6d2e1);
    box-shadow:0 1.5px 1px rgba(15,23,42,.30), inset 0 1px 0 rgba(255,255,255,.95);
    transition:background .1s ease, transform .06s ease;
  }
  @media (hover:hover){
    .cell:not(.revealed):hover{ background:linear-gradient(145deg,#fff,#d8e2ee); }
  }
  .cell:not(.revealed):active{ transform:scale(.93); }

  .cell.revealed{
    background:#e4ebf4;
    box-shadow:inset 0 0 0 1px rgba(148,163,184,.42);
    cursor:default;
    animation:pop .13s ease-out;
  }
  .cell.revealed:active{ transform:none; }
  @keyframes pop{ from{ transform:scale(.86); opacity:.55; } to{ transform:none; opacity:1; } }

  .cell.flag{ animation:flagIn .16s ease-out; }
  @keyframes flagIn{ from{ transform:scale(.7); } to{ transform:none; } }

  .cell.mine{ background:#e9eef6; }
  .cell.boom{ background:#ff5d52; box-shadow:inset 0 0 0 2px #ff8a80; }
  .cell.wrong{ background:#f3d9d7; }

  .n1{ color:#1f6fd0 } .n2{ color:#0f8a4d } .n3{ color:#d92d20 } .n4{ color:#6d28d9 }
  .n5{ color:#a2410c } .n6{ color:#0e7490 } .n7{ color:#111827 } .n8{ color:#64748b }

  /* ---------- 底部 ---------- */
  .foot{
    margin-top:10px; padding:0 2px;
    display:flex; flex-wrap:wrap; align-items:center;
    justify-content:space-between; gap:6px;
    font-size:11.5px; color:#94a3b8; line-height:1.5;
  }
  #best{ color:rgba(252,211,77,.85); }

  /* ---------- 提示条 ---------- */
  .banner{
    position:absolute; left:50%; bottom:66px;
    transform:translateX(-50%) translateY(10px);
    padding:9px 20px; border-radius:12px;
    font-size:13.5px; font-weight:600;
    color:#1a1206; background:#ffe08a;
    box-shadow:0 12px 30px rgba(0,0,0,.5);
    opacity:0; pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    white-space:nowrap;
  }
  .banner.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- 小屏 ---------- */
  @media (max-width:560px){
    .app{ border-radius:0; height:100dvh; max-width:none; padding:10px 10px calc(10px + env(safe-area-inset-bottom)); }
    .led{ min-width:72px; font-size:18px; }
    #face{ width:46px; height:46px; font-size:24px; }
    .sign{ font-size:17px; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand"><span class="bomb">💣</span><h1>扫雷</h1></div>
    <div class="sign">NJ77</div>
  </header>

  <div class="bar">
    <div class="diffs">
      <button class="diff-btn active" data-diff="easy">初级</button>
      <button class="diff-btn" data-diff="normal">中级</button>
      <button class="diff-btn" data-diff="hard">高级</button>
    </div>
    <button class="mode" id="modeBtn">⛏ 挖开</button>
  </div>

  <div class="hud">
    <div class="led" id="mineCount">010</div>
    <button id="face" aria-label="重新开始">🙂</button>
    <div class="led" id="timeCount">000</div>
  </div>

  <div class="board-wrap" id="boardWrap">
    <div class="board" id="board" style="--cols:9"></div>
  </div>

  <footer class="foot">
    <span id="hint">点格子翻开 · 切到「插旗」模式标雷</span>
    <span id="best">暂无记录</span>
  </footer>

  <div id="banner" class="banner"></div>
</div>

<script>
(() => {
  'use strict';

  const DIFFS = {
    easy:   { cols: 9,  rows: 9,  mines: 10, name: '初级' },
    normal: { cols: 16, rows: 16, mines: 40, name: '中级' },
    hard:   { cols: 30, rows: 16, mines: 99, name: '高级' }
  };

  const board    = document.getElementById('board');
  const wrap     = document.getElementById('boardWrap');
  const mineEl   = document.getElementById('mineCount');
  const timeEl   = document.getElementById('timeCount');
  const faceEl   = document.getElementById('face');
  const bestEl   = document.getElementById('best');
  const banner   = document.getElementById('banner');
  const modeBtn  = document.getElementById('modeBtn');
  const hintEl   = document.getElementById('hint');
  const diffBtns = Array.from(document.querySelectorAll('[data-diff]'));

  let cols = 9, rows = 9, mineTotal = 10, total = 81;
  let cells = [];
  let started = false, over = false;
  let flags = 0, revealedCount = 0, seconds = 0;
  let timerId = null;
  let diffKey = 'easy';
  let flagMode = false;
  let longTimer = null, suppressClick = false, downX = 0, downY = 0;

  const pad3 = n => String(Math.max(0, Math.min(999, n))).padStart(3, '0');

  /* ---------- 邻格 ---------- */
  function neighbors(i) {
    const x = i % cols, y = (i / cols) | 0, out = [];
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        const nx = x + dx, ny = y + dy;
        if (nx >= 0 && nx < cols && ny >= 0 && ny < rows) out.push(ny * cols + nx);
      }
    }
    return out;
  }

  /* ---------- 记录 ---------- */
  const bestKey = () => 'ms_best_' + diffKey;

  function loadBest() {
    let v = 0;
    try { v = Number(localStorage.getItem(bestKey())) || 0; } catch (e) {}
    bestEl.textContent = v > 0 ? `最佳 ${v}s · ${DIFFS[diffKey].name}` : `暂无记录 · ${DIFFS[diffKey].name}`;
  }

  function saveBest() {
    try {
      const prev = Number(localStorage.getItem(bestKey())) || 0;
      if (!prev || seconds < prev) localStorage.setItem(bestKey(), String(seconds));
    } catch (e) {}
    loadBest();
  }

  /* ---------- 绘制 ---------- */
  function paintCell(i) {
    const c = cells[i], el = c.el;
    el.className = 'cell';
    el.textContent = '';

    if (c.revealed) {
      el.classList.add('revealed');
      if (c.mine) { el.classList.add('mine'); el.textContent = '💣'; }
      else if (c.adj > 0) { el.textContent = c.adj; el.classList.add('n' + c.adj); }
    } else if (c.flag) {
      el.classList.add('flag');
      el.textContent = '🚩';
    }
  }

  const paintAll = () => { for (let i = 0; i < total; i++) paintCell(i); };

  function updateHud() {
    mineEl.textContent = pad3(mineTotal - flags);
    timeEl.textContent = pad3(seconds);
  }

  function showBanner(text, win) {
    banner.textContent = text;
    banner.style.background = win ? '#ffe08a' : '#ffb4ad';
    banner.classList.add('show');
    clearTimeout(banner._t);
    banner._t = setTimeout(() => banner.classList.remove('show'), 2600);
  }

  /* ---------- 自适应格子 ---------- */
  function fitBoard() {
    const availW = wrap.clientWidth - 26;
    const availH = wrap.clientHeight - 26;
    const gap = 2;
    let cell = Math.floor(Math.min(
      (availW - gap * (cols - 1)) / cols,
      (availH - gap * (rows - 1)) / rows
    ));
    cell = Math.max(18, Math.min(cell, 42));
    board.style.setProperty('--cell', cell + 'px');
    board.style.setProperty('--gap', gap + 'px');
    board.style.setProperty('--cols', cols);
  }

  /* ---------- 新局 ---------- */
  function newGame(key) {
    diffKey = key || diffKey;
    const d = DIFFS[diffKey];
    cols = d.cols; rows = d.rows; mineTotal = d.mines; total = cols * rows;

    started = over = false;
    flags = revealedCount = seconds = 0;
    stopTimer();

    board.style.setProperty('--cols', cols);
    board.innerHTML = '';
    cells = [];

    const frag = document.createDocumentFragment();
    for (let i = 0; i < total; i++) {
      const el = document.createElement('div');
      el.className = 'cell';
      el.dataset.i = i;
      frag.appendChild(el);
      cells.push({ el, mine: false, adj: 0, revealed: false, flag: false });
    }
    board.appendChild(frag);

    diffBtns.forEach(b => b.classList.toggle('active', b.dataset.diff === diffKey));
    faceEl.textContent = '🙂';
    banner.classList.remove('show');

    fitBoard(); paintAll(); updateHud(); loadBest();
  }

  /* ---------- 埋雷（首点安全） ---------- */
  function placeMines(safeIndex) {
    const forbidden = new Set([safeIndex, ...neighbors(safeIndex)]);
    let pool = [];
    for (let i = 0; i < total; i++) if (!forbidden.has(i)) pool.push(i);

    if (pool.length < mineTotal) {
      pool = [];
      for (let i = 0; i < total; i++) if (i !== safeIndex) pool.push(i);
    }

    for (let i = pool.length - 1; i > 0; i--) {
      const j = (Math.random() * (i + 1)) | 0;
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    for (let k = 0; k < mineTotal; k++) cells[pool[k]].mine = true;

    for (let i = 0; i < total; i++) {
      if (cells[i].mine) continue;
      let n = 0;
      for (const j of neighbors(i)) if (cells[j].mine) n++;
      cells[i].adj = n;
    }
  }

  /* ---------- 计时 ---------- */
  function startTimer() {
    stopTimer();
    timerId = setInterval(() => {
      if (seconds < 999) seconds++;
      timeEl.textContent = pad3(seconds);
    }, 1000);
  }
  function stopTimer() {
    if (timerId) clearInterval(timerId);
    timerId = null;
  }

  /* ---------- 翻开 ---------- */
  function flood(start) {
    const stack = [start];
    while (stack.length) {
      const i = stack.pop(), c = cells[i];
      if (c.revealed || c.flag) continue;
      c.revealed = true; revealedCount++;
      paintCell(i);
      if (c.adj === 0) {
        for (const j of neighbors(i)) {
          if (!cells[j].revealed && !cells[j].flag) stack.push(j);
        }
      }
    }
  }

  function revealAt(i) {
    const c = cells[i];
    if (over || c.revealed || c.flag) return;

    if (!started) { started = true; placeMines(i); startTimer(); }
    if (c.mine) { lose(i); return; }

    flood(i);
    checkWin();
  }

  function checkWin() {
    if (revealedCount !== total - mineTotal) return;
    over = true; stopTimer();
    faceEl.textContent = '😎';
    for (let i = 0; i < total; i++) {
      const c = cells[i];
      if (c.mine && !c.flag) { c.flag = true; flags++; paintCell(i); }
    }
    updateHud(); saveBest();
    showBanner(`通关！用时 ${seconds} 秒 🎉`, true);
  }

  function lose(hit) {
    over = true; stopTimer();
    faceEl.textContent = '😵';

    for (let i = 0; i < total; i++) {
      if (i === hit) continue;
      const c = cells[i];
      if (c.mine && !c.flag) {
        c.el.className = 'cell revealed mine'; c.el.textContent = '💣';
      } else if (c.flag && !c.mine) {
        c.el.className = 'cell revealed wrong'; c.el.textContent = '❌';
      }
    }
    const h = cells[hit];
    h.el.className = 'cell revealed boom'; h.el.textContent = '💥';

    showBanner('踩到雷了，再来一局？', false);
  }

  /* ---------- 插旗 ---------- */
  function toggleFlag(i) {
    const c = cells[i];
    if (over || c.revealed) return;
    if (!c.flag && flags >= mineTotal) return;

    c.flag = !c.flag;
    flags += c.flag ? 1 : -1;
    paintCell(i);
    updateHud();
    if (c.flag && navigator.vibrate) navigator.vibrate(12);
  }

  /* ---------- 快速展开 ---------- */
  function chord(i) {
    const c = cells[i];
    if (!c.revealed || c.adj === 0) return;

    const nb = neighbors(i);
    let f = 0;
    for (const j of nb) if (cells[j].flag) f++;
    if (f !== c.adj) return;

    for (const j of nb) {
      if (over) break;
      if (!cells[j].flag && !cells[j].revealed) revealAt(j);
    }
  }

  /* ---------- 模式切换 ---------- */
  function setFlagMode(on) {
    flagMode = on;
    modeBtn.classList.toggle('on', on);
    modeBtn.textContent = on ? '🚩 插旗' : '⛏ 挖开';
    hintEl.textContent = on
      ? '插旗模式：点格子标雷 · 点数字可快速展开'
      : '点格子翻开 · 切到「插旗」模式标雷';
  }
  modeBtn.addEventListener('click', () => setFlagMode(!flagMode));

  /* ---------- 交互 ---------- */
  board.addEventListener('click', e => {
    if (suppressClick) { suppressClick = false; return; }

    const el = e.target.closest('.cell');
    if (!el || over) return;

    const i = Number(el.dataset.i);
    const c = cells[i];

    if (c.revealed) chord(i);
    else if (flagMode) toggleFlag(i);
    else if (!c.flag) revealAt(i);
  });

  board.addEventListener('contextmenu', e => {
    e.preventDefault();
    const el = e.target.closest('.cell');
    if (!el || over) return;
    toggleFlag(Number(el.dataset.i));
  });

  // 长按插旗（桌面/安卓备用；微信内建议用模式按钮）
  board.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' || over) return;
    const el = e.target.closest('.cell');
    if (!el) return;

    const i = Number(el.dataset.i);
    downX = e.clientX; downY = e.clientY;
    clearTimeout(longTimer);

    longTimer = setTimeout(() => {
      longTimer = null;
      suppressClick = true;
      toggleFlag(i);
    }, 380);
  }, { passive: true });

  board.addEventListener('pointermove', e => {
    if (!longTimer) return;
    if (Math.abs(e.clientX - downX) > 9 || Math.abs(e.clientY - downY) > 9) {
      clearTimeout(longTimer); longTimer = null;
    }
  }, { passive: true });

  ['pointerup', 'pointercancel', 'pointerleave'].forEach(evt => {
    board.addEventListener(evt, () => {
      if (longTimer) { clearTimeout(longTimer); longTimer = null; }
    }, { passive: true });
  });

  faceEl.addEventListener('click', () => newGame(diffKey));
  diffBtns.forEach(b => b.addEventListener('click', () => newGame(b.dataset.diff)));

  let rAF = 0;
  window.addEventListener('resize', () => {
    cancelAnimationFrame(rAF);
    rAF = requestAnimationFrame(fitBoard);
  }, { passive: true });
  window.addEventListener('orientationchange', () => setTimeout(fitBoard, 200));

  /* ---------- 启动 ---------- */
  setFlagMode(false);
  newGame('easy');
})();
</script>
</body>
</html>
